{% extends "base.html" %}

{% block title %}찾을 수 없음{% endblock %}

{% block content %}
<section class="card empty-state not-found-card">
  <span class="eyebrow">404 NOT FOUND</span>
  <h1>해당 할 일을 찾을 수 없습니다</h1>
  <p class="subtitle">
    요청하신 할 일(#{{ todo_id }})이 존재하지 않거나 이미 삭제되었습니다.
  </p>
  <div class="hero-actions">
    <a href="/todos" class="btn btn-primary">할 일 목록으로 이동</a>
    <a href="/" class="btn btn-secondary">홈으로 이동</a>
  </div>
</section>
{% endblock %}
