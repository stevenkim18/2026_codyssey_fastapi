{% extends "base.html" %}

{% block title %}할 일 수정{% endblock %}

{% block content %}
<section class="page-header">
  <div>
    <span class="eyebrow">할 일 #{{ todo.id }}</span>
    <h1>할 일 수정</h1>
  </div>
</section>

<section class="card form-card">
  {% if error %}
    <div class="alert alert-error" role="alert">
      {{ error }}
    </div>
  {% endif %}

  <form method="post" action="/todos/{{ todo.id }}/edit" class="todo-form" novalidate>
    <div class="form-group">
      <label for="title" class="form-label">제목 <span class="required">*</span></label>
      <input
        type="text"
        id="title"
        name="title"
        value="{{ form_data.title }}"
        maxlength="100"
        class="input"
      />
    </div>

    <div class="form-group">
      <label for="description" class="form-label">상세 내용</label>
      <textarea
        id="description"
        name="description"
        rows="5"
        class="textarea"
      >{{ form_data.description }}</textarea>
    </div>

    <div class="form-group">
      <label for="due_date" class="form-label">마감일</label>
      <input
        type="date"
        id="due_date"
        name="due_date"
        value="{{ form_data.due_date }}"
        class="input input-date"
      />
    </div>

    <div class="form-group form-checkbox-group">
      <label class="checkbox-label">
        <input
          type="checkbox"
          name="is_completed"
          value="true"
          {% if form_data.is_completed %}checked{% endif %}
        />
        <span>완료된 할 일로 표시</span>
      </label>
    </div>

    <div class="form-actions">
      <div class="actions-left">
        <a href="/todos" class="btn btn-ghost">목록으로</a>
        <a href="/todos/{{ todo.id }}" class="btn btn-secondary">취소</a>
      </div>
      <button type="submit" class="btn btn-primary">수정 저장</button>
    </div>
  </form>
</section>
{% endblock %}
