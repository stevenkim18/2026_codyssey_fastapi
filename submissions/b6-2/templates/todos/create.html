{% extends "base.html" %}

{% block title %}새 할 일 등록{% endblock %}

{% block content %}
<section class="page-header">
  <div>
    <h1>새 할 일 등록</h1>
    <p class="subtitle">해야 할 일의 제목과 세부 내용을 입력해 주세요.</p>
  </div>
</section>

<section class="card form-card">
  {% if error %}
    <div class="alert alert-error" role="alert">
      {{ error }}
    </div>
  {% endif %}

  <form method="post" action="/todos" class="todo-form" novalidate>
    <div class="form-group">
      <label for="title" class="form-label">제목 <span class="required">*</span></label>
      <input
        type="text"
        id="title"
        name="title"
        value="{{ form_data.title }}"
        placeholder="예: FastAPI PRG 패턴 복습하기"
        maxlength="100"
        class="input"
      />
    </div>

    <div class="form-group">
      <label for="description" class="form-label">상세 내용</label>
      <textarea
        id="description"
        name="description"
        rows="5"
        placeholder="할 일에 대한 메모나 세부 계획을 작성하세요. (선택)"
        class="textarea"
      >{{ form_data.description }}</textarea>
    </div>

    <div class="form-group">
      <label for="due_date" class="form-label">마감일</label>
      <input
        type="date"
        id="due_date"
        name="due_date"
        value="{{ form_data.due_date }}"
        class="input input-date"
      />
    </div>

    <div class="form-actions">
      <a href="/todos" class="btn btn-ghost">취소</a>
      <button type="submit" class="btn btn-primary">저장하기</button>
    </div>
  </form>
</section>
{% endblock %}
