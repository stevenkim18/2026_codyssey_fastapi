{% extends "base.html" %}

{% block title %}새 할 일 등록{% endblock %}

{% block content %}
<section class="page-header">
  <div>
    <h1>새 할 일 등록</h1>
    <p class="subtitle">소속 프로젝트를 선택하고 할 일을 등록하세요.</p>
  </div>
</section>

<section class="card">
  {% if error %}
    <div class="alert alert-error" role="alert">{{ error }}</div>
  {% endif %}

  {% if not projects %}
    <div class="empty-state">
      <p>할 일을 등록하려면 먼저 프로젝트가 1개 이상 필요합니다.</p>
      <a href="/projects/new" class="btn btn-primary">새 프로젝트 만들기</a>
    </div>
  {% else %}
    <form method="post" action="/todos" class="todo-form" novalidate>
      <div class="form-group">
        <label for="project_id" class="form-label">소속 프로젝트 <span class="required">*</span></label>
        <select id="project_id" name="project_id" class="select">
          {% for project in projects %}
            <option
              value="{{ project.id }}"
              {% if form_data.project_id == project.id %}selected{% endif %}
            >
              {{ project.name }} ({{ PROJECT_STATUS_LABELS[project.status] }})
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="title" class="form-label">제목 <span class="required">*</span></label>
        <input
          type="text"
          id="title"
          name="title"
          value="{{ form_data.title }}"
          placeholder="예: JWT 인증 의존성 테스트 작성"
          maxlength="100"
          class="input"
        />
      </div>

      <div class="form-group">
        <label for="description" class="form-label">상세 내용</label>
        <textarea
          id="description"
          name="description"
          rows="4"
          class="textarea"
        >{{ form_data.description }}</textarea>
      </div>

      <div class="form-group">
        <label for="due_date" class="form-label">마감일</label>
        <input
          type="date"
          id="due_date"
          name="due_date"
          value="{{ form_data.due_date }}"
          class="input input-date"
        />
      </div>

      <div class="form-actions">
        <a href="/todos" class="btn btn-ghost">취소</a>
        <button type="submit" class="btn btn-primary">할 일 저장</button>
      </div>
    </form>
  {% endif %}
</section>
{% endblock %}
