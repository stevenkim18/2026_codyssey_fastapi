{% extends "base.html" %}

{% block title %}할 일 수정{% endblock %}

{% block content %}
<section class="page-header">
  <div>
    <span class="eyebrow">Todo #{{ todo.id }}</span>
    <h1>할 일 수정</h1>
  </div>
</section>

<section class="card">
  {% if error %}
    <div class="alert alert-error" role="alert">{{ error }}</div>
  {% endif %}

  <form method="post" action="/todos/{{ todo.id }}/edit" class="todo-form" novalidate>
    <div class="form-group">
      <label for="project_id" class="form-label">소속 프로젝트 <span class="required">*</span></label>
      <select id="project_id" name="project_id" class="select">
        {% for project in projects %}
          <option value="{{ project.id }}" {% if form_data.project_id == project.id %}selected{% endif %}>
            {{ project.name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="title" class="form-label">제목 <span class="required">*</span></label>
      <input
        type="text"
        id="title"
        name="title"
        value="{{ form_data.title }}"
        maxlength="100"
        class="input"
      />
    </div>

    <div class="form-group">
      <label for="description" class="form-label">상세 내용</label>
      <textarea
        id="description"
        name="description"
        rows="4"
        class="textarea"
      >{{ form_data.description }}</textarea>
    </div>

    <div class="form-group">
      <label for="due_date" class="form-label">마감일</label>
      <input
        type="date"
        id="due_date"
        name="due_date"
        value="{{ form_data.due_date }}"
        class="input input-date"
      />
    </div>

    <div class="form-group">
      <label for="status" class="form-label">상태</label>
      <select id="status" name="status" class="select">
        {% for key, label in TODO_STATUS_LABELS.items() %}
          <option value="{{ key }}" {% if form_data.status == key %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-actions">
      <a href="/todos/{{ todo.id }}" class="btn btn-ghost">취소</a>
      <button type="submit" class="btn btn-primary">수정 저장</button>
    </div>
  </form>
</section>
{% endblock %}
