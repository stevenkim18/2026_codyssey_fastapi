{% extends "base.html" %}

{% block title %}새 프로젝트 만들기{% endblock %}

{% block content %}
<section class="page-header">
  <div>
    <h1>새 프로젝트 만들기</h1>
    <p class="subtitle">할 일들을 묶어 관리할 새 프로젝트를 생성합니다.</p>
  </div>
</section>

<section class="card">
  {% if error %}
    <div class="alert alert-error" role="alert">{{ error }}</div>
  {% endif %}

  <form method="post" action="/projects" class="todo-form" novalidate>
    <div class="form-group">
      <label for="name" class="form-label">프로젝트 이름 <span class="required">*</span></label>
      <input
        type="text"
        id="name"
        name="name"
        value="{{ form_data.name }}"
        placeholder="예: FastAPI 백엔드 스터디"
        maxlength="100"
        class="input"
      />
    </div>

    <div class="form-group">
      <label for="description" class="form-label">설명</label>
      <textarea
        id="description"
        name="description"
        rows="4"
        placeholder="프로젝트 목표와 내용을 입력하세요."
        class="textarea"
      >{{ form_data.description }}</textarea>
    </div>

    <div class="form-actions">
      <a href="/projects" class="btn btn-ghost">취소</a>
      <button type="submit" class="btn btn-primary">프로젝트 생성</button>
    </div>
  </form>
</section>
{% endblock %}
